<!DOCTYPE html>
<html>
<head>
    <title>template</title>

</head>

<body>


    <a href="lyrics.html" target="_blank">
    <button onclick="myFunction()" style="font-size:25px; background-color: grey; color: lightblue; border-radius: 25px; ">Click me</button>
    </a>

    <p id="greeting">Hello, World!</p>

    <script>
        function myFunction() {
            document.getElementById("greeting").innerHTML = "You clicked the button!";

        }
    </script>
</body>

</html>
